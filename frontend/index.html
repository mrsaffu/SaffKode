<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Safwan Ahmad — Full-Stack Developer</title>
    <meta
      name="description"
      content="Safwan Ahmad is a Full-Stack Developer based in Delhi, India, building scalable, secure, and user-friendly web applications with the MERN stack."
    />
    <script>
      // Applied before React mounts to avoid a flash of the wrong theme.
      // Priority: stored preference > system preference > dark default.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
